<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Schema Generator</title>
        <link href="../shared/theme.css" rel="stylesheet" />
        <link href="styles.css" rel="stylesheet" />
        <link rel="icon" href="../shared/favicon.png" />
    </head>
    <body>
        <main>
            <h3>Schema Generator</h3>
            <hr />
            <div class="layout">
                <aside>
                    <form class="card">
                        <label for="friendly">JSON</label>
                        <textarea
                            name="json"
                            id="object-input"
                            cols="30"
                            rows="20"
                        ></textarea>

                        <button class="primary" id="btn-generate">
                            Generate
                        </button>
                    </form>
                </aside>
                <aside>
                    <section class="card">
                        <p>Depth: <span data-slot="num-depth">0</span></p>
                        <p>Length: <span data-slot="num-entries">0</span></p>
                    </section>

                    <section class="card schema-box">
                        <h3>Generated schema:</h3>
                        <pre data-slot="schema-output" class="schema-scroll">asd</pre>
                    </section>

                    <section class="card field-detail hidden" data-slot="field-detail">
                        <h3>Field detail</h3>
                        <div class="detail-row">
                            <span class="detail-label">Python path:</span>
                            <code class="copyable" data-slot="python-path"></code>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">JS path:</span>
                            <code class="copyable" data-slot="js-path"></code>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Type:</span>
                            <code data-slot="field-type"></code>
                        </div>
                        <div class="detail-row detail-values">
                            <span class="detail-label">Values:</span>
                            <pre data-slot="field-values" class="values-scroll"></pre>
                        </div>
                    </section>
                </aside>
            </div>
        </main>
    </body>
    <script type="module" src="scripts/main.js"></script>
</html>
