<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Knowgraph</title>
        <link href="../shared/theme.css" rel="stylesheet" />
        <link href="styles.css" rel="stylesheet" />
        <link rel="icon" href="../shared/favicon.png" />
    </head>
    <body>
        <aside class="sidebar">
            <button class="primary" data-tab-btn="graph" disabled>Graph</button>
            <button class="primary transparent" data-tab-btn="table">Table</button>
            <button class="primary transparent" data-tab-btn="entities">Entities</button>
            <button class="primary transparent" data-tab-btn="classes">Classes</button>
            <button class="primary transparent" data-tab-btn="relations">Relations</button>
        </aside>
        <aside class="main">
            <section data-tab="graph" class="tab">
                <div class="flex-row">
                    <div class="flex-col">
                        <label for="graph-layout">Layout</label>
                        <select id="graph-layout">
                            <option value="force">Force-directed</option>
                            <option value="circular">Circular</option>
                            <option value="grid">Grid</option>
                        </select>
                    </div>
                    <div class="flex-col">
                        <label for="graph-color">Color by</label>
                        <select id="graph-color">
                            <option value="class">Class</option>
                            <option value="relation">Relation</option>
                        </select>
                    </div>
                    <div class="flex-col">
                        <label for="graph-size">Size by</label>
                        <select id="graph-size">
                            <option value="degree">Degree</option>
                            <option value="centrality">Centrality</option>
                        </select>
                    </div>
                    <div class="flex-col">
                        <label for="graph-query">Query</label>
                        <input type="text" id="graph-query" placeholder="is sibling to=Mariana" />
                    </div>
                </div>
                <div class="graph-canvas-wrap">
                    <canvas></canvas>
                    <aside id="graph-info" class="graph-info" hidden></aside>
                </div>
            </section>
            <table data-tab="table" id="main__table" class="tab" hidden></table>
            <section data-tab="entities" id="main__entities" class="tab" hidden></section>
            <section data-tab="classes" id="main__classes" class="tab" hidden></section>
            <section data-tab="relations" id="main__relations" class="tab" hidden></section>
        </aside>
        <div id="kg-modal" class="kg-modal" hidden>
            <div class="kg-modal-card">
                <h3 class="kg-modal-title"></h3>
                <div class="kg-modal-body flex-col"></div>
                <div class="flex-row kg-modal-actions">
                    <button type="button" class="primary transparent" data-modal-cancel>Cancel</button>
                    <button type="button" class="primary" data-modal-ok>OK</button>
                </div>
            </div>
        </div>
    </body>
    <script type="module" src="scripts/main.js" defer></script>
</html>
