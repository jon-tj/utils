<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jons Utils</title>
        <link rel="stylesheet" href="shared/theme.css" />
        <link rel="icon" href="shared/favicon.png" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
    </head>
    <body>
        <main>
            <h3>Jons Utils</h3>
            <hr />

            <input
                id="search"
                type="search"
                placeholder="Search utilities..."
                autocomplete="off"
                autofocus
            />

            <section id="utils-list" class="grid-container"></section>
            <p id="no-results" hidden>No utilities match your search.</p>

            <section class="card">
                <h4>About</h4>
                <p>
                    This is a collection of utilities that I have created for my
                    own use. I have decided to make them public in case they are
                    useful to anyone else.
                </p>
            </section>
        </main>

        <script src="search.js" defer></script>
    </body>
    <style>
        #search {
            width: 100%;
            border: 1px solid var(--color-table-border);
            margin-bottom: 1rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem 1rem;
            align-items: center;
        }
        .grid-container a,
        .grid-container button.primary {
            width: 100%;
        }
        .grid-container button.primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: flex-start;
        }
        .grid-container .material-symbols-outlined {
            font-size: 1.25rem;
        }
        .grid-container p {
            margin: 0;
        }
        .grid-container .group {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 0.5rem;
        }
        h4 {
            margin: 0;
        }
        #no-results {
            color: var(--color-text-muted);
            font-style: italic;
        }

        .card {
            margin-top: 1rem;
        }
    </style>
</html>
