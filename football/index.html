<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Football Calculator</title>
        <link href="../shared/theme.css" rel="stylesheet" />
        <link href="styles.css" rel="stylesheet" />
        <link rel="icon" href="../shared/favicon.png" />
    </head>
    <body>
        <main>
            <h3>Football Calculator</h3>
            <hr>
            <div class="layout">
                <aside>
                    <form class="card">
                        <section>
                            <label for="odds-team-a">Odds Team Home</label>
                            <input
                                type="number"
                                step="any"
                                name="odds-team-a"
                                id="odds-team-a"
                                required
                            />
                        </section>
                        <section>
                            <label for="odds-draw">Odds Draw</label>
                            <input
                                type="number"
                                step="any"
                                name="odds-draw"
                                id="odds-draw"
                                required
                            />
                        </section>
                        <section>
                            <label for="odds-team-b">Odds Team Away</label>
                            <input
                                type="number"
                                step="any"
                                name="odds-team-b"
                                id="odds-team-b"
                                required
                            />
                        </section>
                        
                        <section>
                            <label for="elo-team-a">Elo Team Home</label>
                            <input
                                type="number"
                                step="any"
                                name="elo-team-a"
                                id="elo-team-a"
                                required
                            />
                        </section>
                        <section>
                            <label for="elo-team-b">Elo Team Away</label>
                            <input
                                type="number"
                                step="any"
                                name="elo-team-b"
                                id="elo-team-b"
                                required
                            />
                        </section>
                        
                        <section>
                            <label for="odds-over-2-5">Odds Over 2.5</label>
                            <input
                                type="number"
                                step="any"
                                name="odds-over-2-5"
                                id="odds-over-2-5"
                                required
                            />
                        </section>
                        <section>
                            <label for="odds-under-2-5">Odds Under 2.5</label>
                            <input
                                type="number"
                                step="any"
                                name="odds-under-2-5"
                                id="odds-under-2-5"
                                required
                            />
                        </section>

                        <section>
                            <label for="neutral">Neutral</label>
                            <input
                                type="checkbox"
                                name="neutral"
                                id="neutral"
                                checked
                            />
                        </section>

                        <section>
                            <label for="friendly">Friendly</label>
                            <input
                                type="checkbox"
                                name="friendly"
                                id="friendly"
                                checked
                            />
                        </section>

                        <section class="form-handles">
                            <button class="transparent" id="btn-reset">Reset</button>
                            <button class="primary" id="btn-calculate">Calculate</button>
                        </section>
                    </form>
                </aside>
                <aside>
                    <table id="score-table">
                        <thead>
                            <tr>
                                <th colspan="7">Correct Score Probabilities</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <div class="card">
                        <section>
                            <p>xG Home: <span data-slot="xGA">0</span></p>
                            <p>xG Away: <span data-slot="xGB">0</span></p>
                            <p>Most likely score: <span data-slot="most-likely-outcome">0-0 D</span> (<span data-slot="most-likely-outcome-probability">0%</span>)</p>
                            <p>Winner probabilities: Home <span data-slot="prob-win-home">0%</span>, Draw <span data-slot="prob-win-draw">0%</span>, Away <span data-slot="prob-win-away">0%</span></p>
                            <p>ELO-based winner probabilities: Home <span data-slot="prob-win-home-elo">0%</span>, Away <span data-slot="prob-win-away-elo">0%</span></p>
                        </section>
                    </div>
                </aside>
            </div>
        </main>
    </body>
    <script type="module" src="scripts/main.js"></script>
</html>
