<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Couple Expense Planner</title>
        <link href="../shared/theme.css" rel="stylesheet" />
        <link href="styles.css" rel="stylesheet" />
        <link rel="icon" href="../shared/favicon.png" />
    </head>
    <body>
        <main>
            <h3>Couple Expense Planner</h3>
            <hr />
            <div class="layout">
                <aside>
                    <form class="card">
                        <label for="friendly">JSON</label>
                        <textarea
                            name="json"
                            id="object-input"
                            cols="30"
                            rows="20"
                        ></textarea>

                        <button class="primary" id="btn-generate">
                            Generate
                        </button>
                    </form>
                </aside>
                <aside>
                    <section class="card">
                        <p>Depth: <span data-slot="num-depth">0</span></p>
                        <p>Length: <span data-slot="num-entries">0</span></p>
                    </section>

                    <section class="card">
                        <h3>Generated schema:</h3>
                        <pre data-slot="schema-output">asd</pre>
                    </section>
                </aside>
            </div>
        </main>
    </body>
    <script type="module" src="scripts/main.js"></script>
</html>
